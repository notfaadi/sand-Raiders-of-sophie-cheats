# Workers Builds: dashboard Deploy command = `npx wrangler deploy` (locked).
# [build] runs Astro before upload; [assets] points at dist so deploy finds an entry.
# workers/site.js ports functions/_middleware.js (redirects + security headers).
# Prefer Pages Functions path when you can change Deploy command — see DEPLOY.md.
#
# Custom Domains: apex + www MUST both hit this Worker so www→apex 301 can run.
# Seobility / redirect checkers fail with status null if www has no DNS / no Worker route.
# See DEPLOY.md § "www DNS + Redirect Rule (required for Seobility)".
# Must match the Worker bound in DNS (apex A/AAAA → this script). Dashboard name: sandraiders-of-sophiecheats
name = "sandraiders-of-sophiecheats"
compatibility_date = "2025-08-01"
main = "./workers/site.js"

# Attach both hostnames (Wrangler 4 Custom Domains). Zone must be on this Cloudflare account.
[[routes]]
pattern = "sandraiderscheats.net"
custom_domain = true

[[routes]]
pattern = "www.sandraiderscheats.net"
custom_domain = true

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
# Astro multi-page site with trailingSlash: always — serve 404.html when present
not_found_handling = "404-page"
# Run Worker before assets so redirects/headers always apply
run_worker_first = true
